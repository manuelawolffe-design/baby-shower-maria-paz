function esc(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2500);
}

function catColor(cat){
  return {
    'Alimentación':{bg:'var(--beige-light)',text:'var(--beige-dark)'},
    'Baño e higiene':{bg:'var(--blue-light)',text:'var(--blue-dark)'},
    'Cuarto y descanso':{bg:'var(--mint-light)',text:'var(--mint-dark)'},
    'Juguetes y estimulación':{bg:'var(--pink-light)',text:'var(--pink-dark)'},
    'Ropa y accesorios':{bg:'var(--coral-light)',text:'var(--coral-dark)'},
    'Paseo':{bg:'var(--blue-light)',text:'var(--blue-dark)'}
  }[cat]||{bg:'var(--blue-light)',text:'var(--blue-dark)'};
}

function toPesos(price){
  if(!price) return 0;
  const str = String(price).toUpperCase();
  // Limpiar: quitar $, letras excepto el punto/coma, y convertir puntos de miles
  const num = parseFloat(str.replace(/[^0-9.,]/g, '').replace(/\./g, '').replace(',', '.')) || 0;
  if(str.includes('USD')) return num * 3450;
  return num;
}

function plantSVG(pct){
  const n=Math.min(6,Math.round(pct/100*6));
  const pos=[{x:60,y:70,r:-25},{x:60,y:52,r:25},{x:60,y:36,r:-20},{x:60,y:20,r:22},{x:60,y:8,r:-15},{x:60,y:-2,r:18}];
  let leaves='';
  for(let i=0;i<n;i++){const p=pos[i];leaves+=`<ellipse cx="${p.x}" cy="${p.y}" rx="11" ry="6" fill="#7FC9A9" transform="rotate(${p.r} ${p.x} ${p.y})"/>`;}
  const flower=pct>=100?`<circle cx="60" cy="4" r="6" fill="#EFA9BE"/><circle cx="60" cy="4" r="2.5" fill="#4A87A3"/>`:'';
  return `<svg width="80" height="100" viewBox="0 0 120 100"><line x1="60" y1="90" x2="60" y2="10" stroke="#3E8F6C" stroke-width="3" stroke-linecap="round"/>${leaves}${flower}</svg>`;
}

function filterGifts(gifts){
  let f=[...gifts];
  if(activeCategory!=='Todos') f=f.filter(g=>g.category===activeCategory);
  if(searchText.trim()) f=f.filter(g=>g.name.toLowerCase().includes(searchText.toLowerCase()));
  if(filterPrice){
    f=f.filter(g=>{
      const p=toPesos(g.price);
      if(filterPrice==='0-50') return p<=50000;
      if(filterPrice==='50-150') return p>50000&&p<=150000;
      if(filterPrice==='150+') return p>150000;
      return true;
    });
  }
  if(sortBy==='asc') f.sort((a,b)=>toPesos(a.price)-toPesos(b.price));
  if(sortBy==='desc') f.sort((a,b)=>toPesos(b.price)-toPesos(a.price));
  return f;
}

/* ══════════════════════════════════════
   FIREBASE: INICIALIZAR REGALOS
══════════════════════════════════════ */
async function seedIfEmpty(){
  const snap = await db.collection('regalos').limit(1).get();
  if(snap.empty){
    const batch = db.batch();
    SEED_GIFTS.forEach(g=>{
      const ref = db.collection('regalos').doc();
      batch.set(ref,{...g, foto:'', takenBy:null, takenAt:null, createdAt: firebase.firestore.FieldValue.serverTimestamp()});
    });
    await batch.commit();
  }
}

          <div class="field">
            <label>Tu nombre</label>
            <input id="gname" type="text" placeholder="Escribe tu nombre completo" autofocus>
            <small>Usa el mismo nombre la próxima vez para ver qué elegiste.</small>
          </div>
          <button class="btn btn-primary" style="width:100%" onclick="loginGuest()">Ver la lista de regalos</button>
          <div class="landing-toggle">¿Eres la administradora? <button class="btn-ghost" onclick="renderLanding(true)">Entrar aquí</button></div>
        `}
      </div>
    </div></div>`;
  const i=document.getElementById('gname')||document.getElementById('apass');
  if(i) i.addEventListener('keydown',e=>{if(e.key==='Enter') adminMode?loginAdmin():loginGuest();});
}

function loginGuest(){
  const v=document.getElementById('gname').value.trim();
  if(!v){toast('Escribe tu nombre para continuar.');return;}
  currentUser={type:'guest',name:v};
  activeCategory='Todos'; searchText=''; filterPrice=''; sortBy='';
  startListening();
}

function loginAdmin(){
  const v=document.getElementById('apass').value;
  if(v!==ADMIN_PASS){toast('Clave incorrecta.');return;}
  currentUser={type:'admin'};
  startListening();
}

function logout(){
  currentUser=null;
  if(unsubscribe){unsubscribe();unsubscribe=null;}
  allGifts=[];
  renderLanding(false);
}

/* ══════════════════════════════════════
   ESCUCHA TIEMPO REAL
══════════════════════════════════════ */
function startListening(){
  document.getElementById('app').innerHTML='<div class="loading"><div class="spinner"></div><p>Cargando regalos...</p></div>';
  if(unsubscribe){unsubscribe();unsubscribe=null;}
  unsubscribe = db.collection('regalos').orderBy('createdAt').onSnapshot(snap=>{
    allGifts = snap.docs.map(d=>({id:d.id,...d.data()}));
    render();
  }, err=>{
    console.error(err);
    toast('Error al cargar los regalos. Recarga la página.');
  });
}

/* ══════════════════════════════════════
   RENDER PRINCIPAL
══════════════════════════════════════ */
function render(){
  if(!currentUser){renderLanding(false);return;}
  if(currentUser.type==='admin') renderAdmin();
  else renderGuest();
}

function topbar(){
  const who=currentUser.type==='admin'?'Panel de administradora':`Hola, <b>${esc(currentUser.name)}</b>`;
  return `<div class="topbar">
    <h1>Regalos para María Paz</h1>
    <div style="display:flex;align-items:center;gap:14px;">
      <span class="who">${who}</span>
      <button class="btn btn-secondary" onclick="logout()">Cambiar usuario</button>
    </div>
  </div>`;
}

function plantBar(){
  const total=allGifts.length, taken=allGifts.filter(g=>g.takenBy).length;
  const pct=total?Math.round(taken/total*100):0;
  const msg=total===0?'Aún no hay regalos.':pct===0?'Sé la primera en elegir un regalo.':pct<100?'Gracias por hacer crecer esta lista.':'¡La lista está completa!';
  return `<div class="plant-wrap">${plantSVG(pct)}<div class="plant-text">
    <p class="eyebrow">Progreso de la lista</p>
    <p class="count">${taken} de ${total} regalos elegidos</p>
    <p class="msg">${esc(msg)}</p>
  </div></div>`;
}

function usedNames(){
  const names=[...new Set(allGifts.filter(g=>g.takenBy).map(g=>g.takenBy))].sort((a,b)=>a.localeCompare(b,'es'));
  if(!names.length) return '';
  return `<div class="names-box">
    <p class="title">Nombres que ya eligieron un regalo</p>
    <p class="list">${names.map(esc).join(', ')}</p>
    <p class="hint">¿Te llamas igual que alguien? Agrega tu apellido para diferenciarte.</p>
  </div>`;
}

/* ══════════════════════════════════════
   RENDER: VISTA INVITADO
══════════════════════════════════════ */
function renderGuest(){
  const cats=['Todos',...new Set(allGifts.map(g=>g.category).filter(Boolean))].sort((a,b)=>a==='Todos'?-1:a.localeCompare(b,'es'));
  const filtered=filterGifts(allGifts);

  let grid='';
  if(!allGifts.length) grid='<div class="empty"><p>La lista se está preparando 🌱</p><p>Vuelve pronto.</p></div>';
  else if(!filtered.length) grid='<div class="empty"><p>Sin resultados</p><p>Intenta con otros filtros.</p></div>';
  else grid=`<div class="grid">${filtered.map(guestCard).join('')}</div>`;

  document.getElementById('app').innerHTML=`
    ${topbar()}${plantBar()}
    <div class="tabs">${cats.map(c=>`<button class="tab${c===activeCategory?' active':''}" onclick="setcat('${esc(c).replace(/'/g,"\\'")}')">${esc(c)}</button>`).join('')}</div>
    <div class="filters-bar">
      <div class="search-box"><input type="text" placeholder="Buscar regalo..." value="${esc(searchText)}" oninput="setsearch(this.value)"></div>
      <div class="filter-group"><label>Precio:</label>
        <select onchange="setprice(this.value)">
          <option value="">Todos</option>
          <option value="0-50"${filterPrice==='0-50'?' selected':''}>Hasta $50.000</option>
          <option value="50-150"${filterPrice==='50-150'?' selected':''}>$50.000–$150.000</option>
          <option value="150+"${filterPrice==='150+'?' selected':''}>Más de $150.000</option>
        </select>
      </div>
      <div class="filter-group"><label>Ordenar:</label>
        <select onchange="setsort(this.value)">
          <option value="">Por defecto</option>
          <option value="asc"${sortBy==='asc'?' selected':''}>Precio: menor a mayor</option>
          <option value="desc"${sortBy==='desc'?' selected':''}>Precio: mayor a menor</option>
        </select>
      </div>
    </div>
    ${usedNames()}${grid}`;
}

function guestCard(g){
  const isMine=currentUser.type==='guest'&&g.takenBy===currentUser.name;
  const isOther=g.takenBy&&!isMine;
  const cls=isMine?'taken-mine':isOther?'taken-other':'';
  const c=catColor(g.category);
  let actions='';
  if(isMine) actions=`<div class="status-mine">✓ Tú elegiste este regalo</div><button class="btn btn-secondary" style="width:100%" onclick="release('${g.id}')">Liberar este regalo</button>`;
  else if(isOther) actions=`<div class="status-taken">Ya fue elegido</div>`;
  else actions=`<button class="btn btn-primary" style="width:100%" onclick="claim('${g.id}')">Elegir este regalo</button>`;
  return `<div class="card gift ${cls}">
    <div class="gift-img">${g.foto?`<img src="${esc(g.foto)}" alt="${esc(g.name)}" onerror="this.parentElement.innerHTML='<span class=\\'placeholder\\'>🎁</span>'">`:'<span class="placeholder">🎁</span>'}</div>
    <div class="gift-body">
      ${g.category?`<span class="gift-cat" style="background:${c.bg};color:${c.text}">${esc(g.category)}</span>`:''}
      <span class="gift-name">${esc(g.name)}</span>
      ${g.price?`<span class="gift-price">${esc(g.price)}</span>`:''}
      ${g.link?`<a class="gift-link" href="${esc(g.link)}" target="_blank" rel="noopener">Ver dónde comprarlo →</a>`:''}
      <div class="gift-actions">${actions}</div>
    </div>
  </div>`;
}

/* ══════════════════════════════════════
   RENDER: VISTA ADMIN
══════════════════════════════════════ */
function renderAdmin(){
  const taken=allGifts.filter(g=>g.takenBy).length;
  const pct=allGifts.length?Math.round(taken/allGifts.length*100):0;
  const rows=allGifts.map(g=>`
    <div class="admin-row">
      ${g.foto?`<img src="${esc(g.foto)}" onerror="this.outerHTML='<div class=\\'ph\\'>🎁</div>'">`:'<div class="ph">🎁</div>'}
      <div class="info">
        <div class="name">${esc(g.name)}</div>
        <div class="meta">${esc(g.category||'Sin categoría')}${g.price?' · '+esc(g.price):''}</div>
        ${g.takenBy?`<div class="taken">Elegido por ${esc(g.takenBy)}</div>`:'<div class="meta" style="color:var(--mint-dark)">Disponible</div>'}
      </div>
      <div class="actions">
        <button class="icon-btn" title="Editar" onclick="openModal('${g.id}')">✏️</button>
        <button class="icon-btn" title="Eliminar" onclick="del('${g.id}')">🗑️</button>
      </div>
    </div>`).join('');
  document.getElementById('app').innerHTML=`
    ${topbar()}
    <div class="plant-wrap">${plantSVG(pct)}<div class="plant-text">
      <p class="eyebrow">Resumen</p>
      <p class="count">${taken} de ${allGifts.length} regalos elegidos</p>
      <p class="msg">Solo tú puedes ver quién eligió cada regalo.</p>
    </div></div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:16px;">
      <button class="btn btn-primary" onclick="openModal()">+ Agregar regalo</button>
    </div>
    ${allGifts.length?`<div class="card">${rows}</div>`:'<div class="empty"><p>No hay regalos todavía</p><p>Agrega el primero.</p></div>'}`;
}

/* ══════════════════════════════════════
   ACCIONES INVITADO
══════════════════════════════════════ */
async function claim(id){
  const g=allGifts.find(x=>x.id===id);
  if(!g||g.takenBy) return;
  try{
    await db.collection('regalos').doc(id).update({takenBy:currentUser.name,takenAt:firebase.firestore.FieldValue.serverTimestamp()});
    toast('¡Regalo elegido! 💛');
  }catch(e){toast('Error al elegir el regalo.');}
}

async function release(id){
  try{
    await db.collection('regalos').doc(id).update({takenBy:null,takenAt:null});
    toast('Regalo liberado.');
  }catch(e){toast('Error al liberar el regalo.');}
}

/* ══════════════════════════════════════
   FILTROS
══════════════════════════════════════ */
function setcat(c){activeCategory=c;renderGuest();}
function setsearch(v){searchText=v;renderGuest();}
function setprice(v){filterPrice=v;renderGuest();}
function setsort(v){sortBy=v;renderGuest();}

/* ══════════════════════════════════════
   MODAL ADMIN
══════════════════════════════════════ */
let editingId=null;

function openModal(id){
  editingId=id||null;
  const g=id?allGifts.find(x=>x.id===id):null;
  const cats=[...new Set(allGifts.map(x=>x.category).filter(Boolean))].sort();
  const ov=document.createElement('div');
  ov.className='overlay'; ov.id='modal-ov';
  ov.innerHTML=`<div class="modal">
    <h2>${g?'Editar regalo':'Agregar regalo'}</h2>
    <div class="field"><label>Nombre *</label><input id="f-name" value="${g?esc(g.name):''}" placeholder="Ej: Coche paseador"></div>
    <div class="field"><label>Categoría *</label>
      <input id="f-cat" list="catlist" value="${g?esc(g.category):''}" placeholder="Ej: Cuarto y descanso">
      <datalist id="catlist">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
    </div>
    <div class="field"><label>Precio (ej: $120.000 COP o $89 USD)</label><input id="f-price" value="${g&&g.price?esc(g.price):''}"></div>
    <div class="field"><label>Link para comprarlo</label><input id="f-link" value="${g&&g.link?esc(g.link):''}" placeholder="https://..."></div>
    <div class="field">
      <label>Imagen del regalo</label>
      <input id="f-img" type="file" accept="image/*" onchange="prevImg(this)">
      <small>Sube una foto del producto. Se guardará automáticamente.</small>
      <div id="img-prev">${g&&g.foto?`<img src="${esc(g.foto)}" class="img-preview">`:''}</div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="save-btn" onclick="saveGift()">Guardar</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click',e=>{if(e.target===ov)closeModal();});
}

function prevImg(input){
  if(!input.files[0]) return;
  const r=new FileReader();
  r.onload=e=>{document.getElementById('img-prev').innerHTML=`<img src="${e.target.result}" class="img-preview">`;};
  r.readAsDataURL(input.files[0]);
}

function closeModal(){
  const ov=document.getElementById('modal-ov');
  if(ov) ov.remove();
}

async function saveGift(){
  const name=document.getElementById('f-name').value.trim();
  const category=document.getElementById('f-cat').value.trim();
  const price=document.getElementById('f-price').value.trim();
  const link=document.getElementById('f-link').value.trim();
  const file=document.getElementById('f-img').files[0];
  if(!name||!category){toast('Nombre y categoría son obligatorios.');return;}
  const btn=document.getElementById('save-btn');
  btn.disabled=true; btn.textContent='Guardando...';
  try{
    let foto=editingId?allGifts.find(x=>x.id===editingId)?.foto||'':'';
    if(file){
      toast('Subiendo imagen...');
      const ref=storage.ref(`regalos/${Date.now()}_${file.name}`);
      await ref.put(file);
      foto=await ref.getDownloadURL();
    }
    const data={name,category,price,link,foto};
    if(editingId){
      await db.collection('regalos').doc(editingId).update(data);
    } else {
      await db.collection('regalos').add({...data,takenBy:null,takenAt:null,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    }
    closeModal(); toast('¡Guardado!');
  }catch(e){
    console.error(e); toast('Error al guardar. Intenta de nuevo.');
    btn.disabled=false; btn.textContent='Guardar';
  }
}

async function del(id){
  if(!confirm('¿Eliminar este regalo de la lista?')) return;
  try{
    await db.collection('regalos').doc(id).delete();
    toast('Regalo eliminado.');
  }catch(e){toast('Error al eliminar.');}
}

/* ══════════════════════════════════════
   INICIO
══════════════════════════════════════ */
(async()=>{
  try{
    await seedIfEmpty();
  }catch(e){
    console.error('Error al inicializar regalos:',e);
  }
  renderLanding(false);
})();
</script>
</body>
</html>
